# The levels of the product, each with its name. Tools read the name of a level from here; the
# repos of the subsystems take theirs from this file. The regulatory requirements (n1) lie in
# specs-and-deploy-process, above.
# Format: formats.md of specs-and-deploy-process, section Levels
schema: schemas/levels.schema.json
type: levels
levels:
- key: h1
  part: [product]
  name: hazards and threats
  abbreviation: HAZ, THR
  description: hazards (HAZ) and threats (THR), told apart by their prefix - a trace starts here or
    at r1
  reference: the method of IEC61508-1, clause 7.4; IEC62443-3-2
- key: h2
  part: [product]
  name: controls of hazards and threats
  abbreviation: HAZC, THRC
  description: the measure that controls a hazard (HAZC) or a threat (THRC), and asks for r2
- key: r1
  part: [product]
  name: user needs
  abbreviation: UN
  description: user needs (UN)
  reference: ISO12207, clause 6.4.2 - stakeholder needs and requirements definition
- key: r2
  part: [product]
  name: system requirements
  abbreviation: SYS
  description: system requirements (SYS)
  reference: ISO12207, clause 6.4.3 - system requirements definition
- key: r3
  part: [product]
  name: system architecture
  abbreviation: ARC
  description: system architecture (ARC)
  reference: ISO12207, clause 6.4.4 - architecture definition
- key: r5
  part: [product]
  name: software requirements
  abbreviation: SR
  description: software requirements (SR) per subsystem
  reference: ISO12207, clause 6.4.3 - software requirements definition
- key: r6
  part: [product]
  name: software architecture
  abbreviation: SA
  description: 'software architecture of a subsystem: its components'
  reference: ISO12207, clause 6.4.4 - architecture definition
- key: r7
  part: [product]
  name: software design
  abbreviation: SD
  description: 'software design of a subsystem: its modules and units'
  reference: ISO12207, clause 6.4.5 - design definition
- key: sc1
  part: [product]
  name: source code, function coverage
  abbreviation: SC
  description: the source code, measured by the share of its functions the tests call
  reference: ISO29119-4, clause 5.3 - structure-based test design
- key: document
  part: [product]
  name: documents
  description: a document that explains no level of requirements or tests, in Markdown, such as README.md
- key: r7tc
  part: [product]
  name: unit test
  abbreviation: MT
  description: a function or a package
  reference: ISO29119
  data: made in the test
- key: r7tp
  part: [product]
  name: unit test procedure
  abbreviation: MT TP
  description: the test procedures that carry out the test cases of r7tc, or verify a requirement directly
  reference: ISO29119
- key: r7tr
  part: [product]
  name: unit test result
  abbreviation: MT TR
  description: the result of a run of a test procedure of r7tp, or of a test case of r7tc run by hand
  reference: ISO29119
- key: r6tc
  part: [product]
  name: integration test
  abbreviation: SwIT
  description: a subsystem, through its API and its model
  reference: ISO29119
  data: synthetic, in memory
- key: r6tp
  part: [product]
  name: integration test procedure
  abbreviation: SwIT TP
  description: the test procedures that carry out the test cases of r6tc, or verify a requirement directly
  reference: ISO29119
- key: r6tr
  part: [product]
  name: integration test result
  abbreviation: SwIT TR
  description: the result of a run of a test procedure of r6tp, or of a test case of r6tc run by hand
  reference: ISO29119
- key: r5tc
  part: [product]
  name: subsystem test
  abbreviation: SwVal
  description: a subsystem against its SR, through its API and its model
  reference: ISO29119
  data: from gel
- key: r5tp
  part: [product]
  name: subsystem test procedure
  abbreviation: SwVal TP
  description: the test procedures that carry out the test cases of r5tc, or verify a requirement directly
  reference: ISO29119
- key: r5tr
  part: [product]
  name: subsystem test result
  abbreviation: SwVal TR
  description: the result of a run of a test procedure of r5tp, or of a test case of r5tc run by hand
  reference: ISO29119
- key: r3tc
  part: [product]
  name: system integration test
  abbreviation: SysIT
  description: the containers built and working together
  reference: ISO29119
- key: r3tp
  part: [product]
  name: system integration test procedure
  abbreviation: SysIT TP
  description: the test procedures that carry out the test cases of r3tc, or verify a requirement directly
  reference: ISO29119
- key: r3tr
  part: [product]
  name: system integration test result
  abbreviation: SysIT TR
  description: the result of a run of a test procedure of r3tp, or of a test case of r3tc run by hand
  reference: ISO29119
- key: r2tc
  part: [product]
  name: system test
  abbreviation: SysQT
  description: the system against SYS
  reference: ISO29119
  data: the containers with demo data
- key: r2tp
  part: [product]
  name: system test procedure
  abbreviation: SysQT TP
  description: the test procedures that carry out the test cases of r2tc, or verify a requirement directly
  reference: ISO29119
- key: r2tr
  part: [product]
  name: system test result
  abbreviation: SysQT TR
  description: the result of a run of a test procedure of r2tp, or of a test case of r2tc run by hand
  reference: ISO29119
- key: r1tc
  part: [product]
  name: acceptance test
  abbreviation: Val
  description: the system against the user needs
  reference: ISO29119
  data: the containers with reference data
- key: r1tp
  part: [product]
  name: acceptance test procedure
  abbreviation: Val TP
  description: the test procedures that carry out the test cases of r1tc, or verify a requirement directly
  reference: ISO29119
- key: r1tr
  part: [product]
  name: acceptance test result
  abbreviation: Val TR
  description: the result of a run of a test procedure of r1tp, or of a test case of r1tc run by hand
  reference: ISO29119
