type: architecture
level: r3
documents: [architecture/system-architecture.md, architecture/attributes.md]
requirements:
- object_key: ARC_23
  object_version: '1.1.1'
  object_text: 'mode database: keep the data sets in a database server of their own, which the
    reporter reaches through `StorageSource`'
  source_ids: [SYS_20@1.1.1]
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: ARC_24
  object_version: '1.1.1'
  object_text: 'mode database with the reporter: keep the data sets in a database run together with
    the reporter, where a database server of their own is not possible'
  source_ids: [SYS_20@1.1.1]
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: ARC_25
  object_version: '1.1.1'
  object_text: 'mode file: answer from a data file the reporter reads, where no database server can
    be reached'
  source_ids: [SYS_21@1.1.1, SYS_55@1.1.1]
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: ARC_26
  object_version: '1.1.1'
  object_text: 'mode memory: answer from generated data in the memory of the reporter, for the demo
    and the tests'
  source_ids: [SYS_20@1.1.1, SYS_55@1.1.1]
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: ARC_27
  object_version: '1.1.1'
  object_text: 'read every mode through `StorageSource`, and serve the viewer the same API from each'
  source_ids: [SYS_19@1.1.1]
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: ARC_28
  object_version: '1.1.1'
  object_text: 'answer, in a running reporter, from one mode only, chosen at its start'
  source_ids: [SYS_20@1.1.1]
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: ARC_29
  object_version: '1.1.1'
  object_text: 'scope: name in every request the organization, the project, one subsystem and the
    baseline, and answer it from that scope alone; refuse a request that names every subsystem (`*`),
    with the reason'
  source_ids: [SYS_9@2.1.1, SYS_20@1.1.1]
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: ARC_30
  object_version: '1.1.1'
  object_text: 'process: take in a request the process reference model the data are read as, and name
    the levels of the answer in its vocabulary'
  source_ids: [SYS_14@1.1.1]
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: ARC_31
  object_version: '1.1.1'
  object_text: 'narrowing: narrow the rows by function, feature, priority, safety class, platform,
    launch and stream; `*` or nothing stands for every one'
  source_ids: [SYS_9@2.1.1, SYS_83@1.1.1]
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: ARC_32
  object_version: '1.1.1'
  object_text: 'level: take in a request the level the trace starts at, or the level counted, by its
    key'
  source_ids: [SYS_1@1.1.1, SYS_5@1.1.1]
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: ARC_33
  object_version: '1.1.1'
  object_text: 'component: narrow a request on the code by component and by unit of the design'
  source_ids: [SYS_1@1.1.1, SYS_82@1.1.1]
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: ARC_34
  object_version: '1.1.1'
  object_text: 'above: send the levels above each row, up to the roots, only where the request asks
    for them'
  source_ids: [SYS_1@1.1.1, SYS_52@1.1.1]
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: ARC_35
  object_version: '1.1.1'
  object_text: 'keys: send each cell as the keys of its objects with their states, or as the count per
    state, as the request asks'
  source_ids: [SYS_1@1.1.1, SYS_5@1.1.1]
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: ARC_36
  object_version: '1.1.1'
  object_text: 'format: answer as JSON or as CSV, as the request asks'
  source_ids: [SYS_31@1.1.1]
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: ARC_37
  object_version: '1.1.1'
  object_text: 'refusal: refuse a request with a parameter it does not know, or a value it cannot
    answer, with the reason (422); say that the data are not there yet, or that the data source cannot
    be read, as such (503)'
  source_ids: [SYS_29@1.1.1, SYS_34@1.1.1, SYS_37@1.1.1]
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: ARC_38
  object_version: '1.1.1'
  object_text: 'scope names: hand the names of every scope - organizations, requirements projects and
    their subsystems, releases, libraries'
  source_ids: [SYS_9@2.1.1, SYS_20@1.1.1]
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: ARC_39
  object_version: '1.1.1'
  object_text: 'baselines: hand each baseline with its project, start and end, and for a library the
    release it was delivered into'
  source_ids: [SYS_17@1.1.1]
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: ARC_40
  object_version: '1.1.1'
  object_text: 'objects: hand every object with its scope, its key, its level by key and its state,
    as read and mapped'
  source_ids: [SYS_1@1.1.1, SYS_5@1.1.1, SYS_8@1.1.1, SYS_20@1.1.1]
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: ARC_41
  object_version: '1.1.1'
  object_text: 'links: hand the links downward between every two types the trace joins, each object
    once however many link to it'
  source_ids: [SYS_1@1.1.1, SYS_2@1.1.1, SYS_6@1.1.1, SYS_12@1.1.1, SYS_13@1.1.1]
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: ARC_42
  object_version: '1.1.1'
  object_text: 'kinds of test: hand test cases, test procedures and test results as kinds apart'
  source_ids: [SYS_8@1.1.1]
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: ARC_43
  object_version: '1.1.1'
  object_text: 'narrowing: hand on every level function, feature, priority, safety class, platform,
    launch and stream'
  source_ids: [SYS_9@2.1.1, SYS_11@1.1.1]
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: ARC_44
  object_version: '1.1.1'
  object_text: 'verification: hand per requirement its verification method, and per level of the
    head whether it is verified'
  source_ids: [SYS_2@1.1.1, SYS_73@1.1.1]
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: ARC_45
  object_version: '1.1.1'
  object_text: 'components: hand per object its component and unit, and the components with their
    units'
  source_ids: [SYS_1@1.1.1]
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: ARC_46
  object_version: '1.1.1'
  object_text: 'head: hand per requirements project its head - the levels in order, with key, name and
    views'
  source_ids: [SYS_14@1.1.1, SYS_49@1.2.1]
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: ARC_47
  object_version: '1.1.1'
  object_text: 'work products: hand the work products with baseline, revision, level, kind and
    store, and the stores with their work products'
  source_ids: [SYS_15@1.1.1]
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: ARC_48
  object_version: '1.1.1'
  object_text: 'read error: say a read that fails, with the error, apart from a read that found no
    data'
  source_ids: [SYS_29@1.1.1, SYS_37@1.1.1, SYS_38@1.1.1]
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: ARC_49
  object_version: '1.1.1'
  object_text: 'pending: say while the data set is still being filled'
  source_ids: [SYS_34@1.1.1, SYS_54@1.1.1]
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: ARC_50
  object_version: '1.1.1'
  object_text: 'derived values again: make the derived values of a stored data set again on request
    when a rule changes, back in time, without fetching the data from the source systems again'
  source_ids: [ARCD_3@2.1.1]
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: ARC_53
  object_version: '1.1.1'
  object_text: 'tools: offer an assistant one tool per view of the viewer'
  source_ids: [SYS_99@1.1.1]
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: ARC_54
  object_version: '1.1.1'
  object_text: 'limit: answer at most as many rows as the assistant names, 100 where it names none,
    and say how many rows were left out'
  source_ids: [SYS_99@1.1.1]
  rationale: the artifacts of one project are thousands of rows and megabytes, which is no answer an
    assistant can read
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: ARC_55
  object_version: '1.1.1'
  object_text: 'organization: answer an assistant from the one organization the server is started
    with, and never ask the assistant for it'
  source_ids: [SYS_88@1.1.1]
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
- object_key: ARC_56
  object_version: '1.1.1'
  object_text: 'baseline: answer a request that names no release (`*`) from the newest release of the
    project and the newest library that release delivered'
  source_ids: [SYS_9@2.1.1]
  rationale: whoever opens a view looks at the newest first
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [test]
