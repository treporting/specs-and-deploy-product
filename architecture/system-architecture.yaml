elements:
- object_key: ARC_1
  object_version: '1.4.1'
  kind: subsystem
  repo: trace/viewer
  object_text: 'single page application: shows what the reporter answers - tables, charts, the trace -
    with filters, and hands tables and charts on'
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [analysis]
- object_key: ARC_2
  object_version: '1.5.1'
  kind: subsystem
  repo: trace/reporter
  object_text: 'REST API: answers trace, states, maturity and compliance from one data set; takes the
    identity from the proxy or the identity provider and checks the role; records every report'
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [analysis]
- object_key: ARC_3
  object_version: '2.5.1'
  kind: subsystem
  repo: trace/storage
  object_text: 'the model, the data sets and the `StorageSource` interface over them - a database branch, generated
    data or a data file; the generator of data of known content; the import, the same for every system:
    counts what was stored, fingerprints it, stores every value as it is handed, sets the state and
    keeps the import record; the audit trail'
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [analysis]
- object_key: ARC_4
  object_version: '1.5.1'
  kind: subsystem
  repo: trace/converter
  object_text: maps the customized attributes of an attribute-based system to the model, by a configuration
    file of the customer; one general mechanism for all of them
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [analysis]
- object_key: ARC_5
  object_version: '3.5.1'
  kind: subsystem
  repo: trace/extractor-content
  object_text: 'extracts the information the files of a file-based system hold - requirements, test
    cases, test results, annotations -: it takes the files from the extractor of the system and hands
    them to a package for each kind of content, each a plug-in, a program of its own that
    extractor-content starts. The package annotations reads `@implements` and `@verifies` from Go
    files; it is the repo reporter-annotations today'
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [analysis]
- object_key: ARC_6
  object_version: '1.3.1'
  kind: subsystem
  repo: extractor-system
  object_text: 'one per system, such as extractor-git or extractor-codebeamer: connects to it, lists and
    fetches what it holds with its identity in the system - revision, commit - and counts it by a query
    of its own'
  priority: 'medium'
  safety: ''
  status: approved
  verification_method: [analysis]
- object_key: ARC_51
  object_version: '1.3.1'
  kind: subsystem
  repo: trace/mcp
  object_text: 'answers an assistant what the viewer shows, from the reporter over the REST API; names
    with every answer the view and the filters that show the same'
  priority: 'medium'
