# Review criteria of the elements and the requirements of the architecture (r3), after ISO29148 read for them.
# An element is approved only when it passed every criterion (PROC_13). See reviews/README.md.
schema: schemas/review-criteria.schema.json
type: criteria
level: r3
criteria:
- object_key: RC_1
  source: REG_ISO29148_1 - necessary
  object_text: necessary - a requirement names a system requirement, a rationale or a decision as
    uplink, or gives its rationale; an element is a part of the system a requirement can stand on
  question: Does a requirement name its uplink or give its rationale, and is an element a part a requirement can stand on?
- object_key: RC_2
  source: REG_ISO29148_1 - appropriate; what part of the system, not its design inside, is the rule of r3 of treporting
  object_text: appropriate - it states which part of the system it is - a subsystem, an interface, a
    model - and its responsibility, not its design inside
  question: Does it state which part of the system it is and its responsibility, naming no design inside?
- object_key: RC_3
  source: REG_ISO29148_1 - unambiguous
  object_text: unambiguous - it can be read one way only
  question: Can it be read one way only?
- object_key: RC_4
  source: REG_ISO29148_1 - singular, read for an element
  object_text: singular - it has one responsibility, not several
  question: Does it have one responsibility, not several?
- object_key: RC_5
  source: REG_ISO29148_1 - complete
  object_text: complete - it can be understood without further explanation; an interface or a model
    names its contract
  question: Can it be understood as it stands, and does an interface or a model name its contract?
- object_key: RC_6
  source: REG_ISO29148_2 - consistent, a characteristic of the set
  object_text: consistent - it contradicts no other element, no decision and no requirement
  question: Does it contradict no other element, decision or requirement?
- object_key: RC_7
  source: REG_ISO29148_1 - verifiable
  object_text: verifiable - its verification method can show that it is met
  question: Can its verification method show that it is met?
- object_key: RC_8
  source: REG_ISO29148_1 - feasible
  object_text: feasible - it can be realized with a reasonable effort
  question: Can it be realized with a reasonable effort?
- object_key: RC_9
  source: REG_ISO29148_1 - correct
  object_text: correct - a requirement states rightly the share of its subsystem in what its uplinks
    ask for
  question: Does a requirement state rightly the share of its subsystem in what its uplinks ask for?
- object_key: RC_10
  source: treporting - traceable and allocated, the breakdown per subsystem
  object_text: traceable - every uplink exists; its `component` names the subsystem that does what it
    states, and its `interface` the interface it is met over
  question: Does every uplink exist, does component name the subsystem that does what it states, and interface the interface it is met over?
- object_key: RC_11
  source: REG_ISO29148_1 - conforming; what to conform to is set by treporting, formats.md
  object_text: conforming - it follows formats.md - id, kind, status and verification method, and a
    contract for an interface or a model
  question: Does it follow formats.md?
